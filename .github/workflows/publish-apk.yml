name: Publish APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-main-apk
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
          fi
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools are missing under $ANDROID_HOME."
            exit 1
          fi
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100             --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          source=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)
          pattern='^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          [[ "$source" =~ $pattern ]] || { echo "::error::Invalid project versionName"; exit 1; }

          version="$source"
          if [[ "$release" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)-[0-9]{8}$ ]]; then
            latest="${BASH_REMATCH[1]}"
            notes=$(gh release view "$release" --json body --jq .body)
            baseline=$(sed -nE 's/^<!-- source-version: ([0-9.]+) -->$/\1/p' <<< "$notes")
            if [[ "${source}" == "${latest}" || "$source" == "$baseline" ]]; then
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((10#${patch:-0} + 1))"
            fi
          fi
          tag="v$version-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::Release tag $tag already exists. Choose a different project version."
            exit 1
          fi
          {
            echo "source=$source"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::Configure RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          umask 077
          store="$RUNNER_TEMP/release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store"
          echo "RELEASE_STORE_FILE=$store" >> "$GITHUB_ENV"
      - name: Build and verify APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"$VERSION\"/" app/build.gradle.kts
          epoch=$(date -d '2026-11-13 00:00:00 +0800' +%s)
          version_code=$(( $(date +%s) - epoch ))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Time-based versionCode is out of range: $version_code"
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=[[:space:]]*)[0-9]+[[:space:]]*$/\1$version_code/" app/build.gradle.kts
          bash ./gradlew :app:assembleRelease "-PreleaseDate=${TAG##*-}"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "app/build/outputs/apk/release/ApkDisguiser-${TAG%-*}-arm64-${TAG##*-}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_VERSION: ${{ steps.version.outputs.source }}
        run: |
          apk="ApkDisguiser-${TAG%-*}-arm64-${TAG##*-}.apk"
          cp "app/build/outputs/apk/release/$apk" "$apk"
          jq --arg apk "$apk" --argjson size "$(wc -c < "$apk")" --arg updateDate "$(TZ=Asia/Shanghai date +%F)" --arg sha256 "$(sha256sum "$apk" | cut -d ' ' -f 1)" '
            .applicationId as $package |
            .elements[] | select(.outputFile == $apk) |
            {packageName: $package, versionCode, versionName, apk: $apk, size: $size, updateDate: $updateDate, sha256: $sha256}
          ' app/build/outputs/apk/release/output-metadata.json > update.json
          test -s update.json
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*-[0-9]*'             --match 'build-*' "$GITHUB_SHA" 2>/dev/null || true)
          range="$GITHUB_SHA"
          if [[ -n "$previous" ]]; then
            range="$previous..$GITHUB_SHA"
          fi
          {
            printf '<!-- source-version: %s -->\n\n' "$SOURCE_VERSION"
            git log --invert-grep --grep='^chore(release): 同步发布版本 ' --format='- %h %s' "$range"
          } > release-notes.md

          gh release create "$TAG" "$apk" update.json --target "$GITHUB_SHA"             --title "$TAG" --notes-file release-notes.md

      - name: Sync release version to main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::warning::main advanced during this release; the newer push will publish and sync its own version."
            exit 0
          fi
          git add -- app/build.gradle.kts
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): 同步发布版本 $TAG [skip ci]"
          git push origin HEAD:refs/heads/main
